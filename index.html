<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/output.css">
</head>
<body class="bg-gray-300">


<main>
    <section id="workspace">
        <div class=" flex  flex-col lg:flex-row gap-5 lg:gap-4 lg:py-8 px-5 py-4 lg:px-10    lg:justify-between   ">


            <div class=" flex lg:grow flex-col gap-5 lg:gap-3 items-center px-4 bg-white rounded-2xl shadow-xl order-2 lg:order-1 py-4 min-h-56 w-[1fr]">
                <button class="bg-amber-400 px-8 py-2 rounded-2xl text-white w-full  whitespace-nowrap" type="button">
                    Ajouter un Agent
                </button>
                <div id="workerContainer" class="border-t-2 border-t-gray-600 w-full">1</div>
            </div>

            <div class=" lg:aspect-[16/9] md:aspect-[16/10] aspect-[16/12] lg:max-w-[80%]  w-full self-start border-4 border-white shadow-2xl rounded-2xl order-1 lg:order-2">
                <div class="rooms_container text-white grid grid-cols-[38%_17%_22%_22%] grid-rows-[35%_31%_32.5%] relative w-full h-full">
                    <img src="assets/background.jpg" class="absolute top-0 left-0  w-full h-full  rounded-2xl"
                         alt="workspace"/>
                    <div id="conference" class="  col-start-1 col-end-2 row-start-1 row-end-2 bg-orange-700   z-10">
                        conference
                    </div>
                    <div id="reception" class="  col-start-1 col-end-2 row-start-2 row-end-4 bg-yellow-700  z-10">
                        reception
                    </div>
                    <div id="servers" class="  col-start-3 col-end-4 row-start-1 row-end-2 bg-white z-10">servers</div>
                    <div id="security" class=" col-start-4 col-end-5 row-start-1 row-end-2 bg-blue-700 z-10">security
                    </div>
                    <div id="personnel" class="  col-start-3 col-end-4 row-start-3 row-end-4  bg-green-600 z-10">
                        personnel
                    </div>
                    <div id="archive" class=" col-start-4 col-end-5 row-start-3 row-end-4  bg-fuchsia-400 z-10">archive
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>


<section id="form_section" class=" hidden left-0 top-0 w-full h-full bg-red-950  z-10">

    <form class="flex flex-col py-4 px-4 gap-y-1 bg-white border-1 border-amber-500 shadow-amber-600 rounded-2xl  w-96 absolute top-1/2 left-1/2 -translate-1/2 ">
        <label for="name">Nom</label>
        <input id="name" class="outline-1 outline-amber-400 rounded-md px-4 py-1" type="text">
        <label for="role">Role</label>
        <select id="role" class="outline-1 outline-amber-400 rounded-md px-4 py-1" type="text">
            <option value="receptionist">Réceptionniste</option>
            <option value="technicien">Techniciens IT</option>
            <option value="admin">Admin</option>
            <option value="administrator">Administrator</option>
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
        </select>
        <div class="flex items-center my-4 gap-5">
            <div class="rounded-full border-1 border-amber-400 aspect-square h-20" id="profileImage"></div>
            <div class="flex flex-col grow">
                <label for="image">Image</label>
                <input id="image" class="outline-1 outline-amber-400 rounded-md px-4 py-1 " value="image" type="url"></div>
        </div>
        <div>
            <div id="experienceContainer" class="flex flex-col ">
                <div class="flex-col flex">
                    <label>Experience Titre</label>
                    <input type="text" value="" class="outline-1 outline-amber-400 rounded-md px-4 py-1">
                    <label> Experience Description </label>
                    <input type="text" value="" class="outline-1 outline-amber-400 rounded-md px-4 py-1">
                </div>





            </div>
        </div>
        <button type="button" id="btnExper"
                class=" bg-orange-400 rounded-md mt-4 text-white w-fit px-2 cursor-pointer py-1 self-center ">
            Ajouter une autre experience
        </button>
        </div>
        <label for="email">Email</label>
        <input id="email" class="outline-1 outline-amber-400 rounded-md px-4 py-1" type="email">
        <label for="telephone">Telephone</label>
        <input id="telephone" class="outline-1 outline-amber-400 rounded-md px-4 py-1" type="tel">
        <button type="submit" id="btnSubmit"
                class=" bg-amber-700 rounded-md mt-4 text-white w-fit px-4 cursor-pointer py-1 self-center ">AJOUTER
        </button>
    </form>
</section>


<script src="./js/index.js"></script>
</body>
</html>
